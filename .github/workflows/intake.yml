# A new issue lands on the board in Todo.
name: intake
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/board.py status ${{ github.event.issue.number }} Todo
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
